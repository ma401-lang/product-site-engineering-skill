name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bundle
        run: python3 product-site-engineering/scripts/validate_skill.py .
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
